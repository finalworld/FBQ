name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -type f | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Hittade ingen zip-fil."
            exit 1
          fi

          echo "Packar upp: $ZIP_FILE"
          mkdir -p extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS_FILE=$(find extracted-project \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -type f | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Hittade inget Androidprojekt."
            find extracted-project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Androidprojekt hittat i: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Remove local Android Studio settings
        shell: bash
        run: |
          rm -f "$PROJECT_DIR/local.properties"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frasses-Bone-Quest-v0.001-fix8-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
