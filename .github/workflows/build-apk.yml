name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -type f | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Ingen zip-fil hittades."
            exit 1
          fi

          mkdir extracted-project
          unzip -q "$ZIP_FILE" -d extracted-project

      - name: Find Android project
        shell: bash
        run: |
          SETTINGS=$(find extracted-project \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Androidprojekt hittades inte."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Remove local.properties
        run: rm -f "$PROJECT_DIR/local.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mv "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "$PROJECT_DIR/app/build/outputs/apk/debug/Frasses_Bone_Quest_v0.001_fix10.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frasses_Bone_Quest_v0.001_fix10
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/Frasses_Bone_Quest_v0.001_fix10.apk
          if-no-files-found: error
